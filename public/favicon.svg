<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#071739"/>
      <stop offset="100%" stop-color="#020612"/>
    </radialGradient>
    <linearGradient id="favA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#favBg)"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Orbital ring -->
  <ellipse cx="50" cy="50" rx="38" ry="12" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(-28 50 50)" filter="url(#favGlow)"/>
  <!-- Central Emblem A -->
  <g filter="url(#favGlow)">
    <path d="M 50 20 L 26 78 L 36 78 L 50 42 Z" fill="#67e8f9"/>
    <path d="M 50 20 L 74 78 L 64 78 L 50 42 Z" fill="url(#favA)"/>
    <polygon points="36,66 64,66 62,72 38,72" fill="#ffffff"/>
  </g>
</svg>
