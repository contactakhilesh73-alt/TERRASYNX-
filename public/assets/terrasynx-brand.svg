<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Space Radial Background -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#071739"/>
      <stop offset="60%" stop-color="#040b1e"/>
      <stop offset="100%" stop-color="#020612"/>
    </radialGradient>

    <!-- Glowing Cyan/Blue Gradients -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Filters for Laser Glow -->
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="60" fill="url(#spaceBg)"/>

  <!-- Radar Grid Target Rings -->
  <circle cx="250" cy="220" r="190" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8"/>
  <circle cx="250" cy="220" r="150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="250" cy="220" r="110" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="250" cy="220" r="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Global Longitude / Latitude Arc Lines -->
  <ellipse cx="250" cy="220" rx="170" ry="60" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.3" transform="rotate(-15 250 220)"/>
  <ellipse cx="250" cy="220" rx="170" ry="60" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" transform="rotate(35 250 220)"/>

  <!-- Radar Crosshairs -->
  <line x1="250" y1="40" x2="250" y2="400" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 5"/>
  <line x1="60" y1="220" x2="440" y2="220" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 5"/>

  <!-- Satellite Network Data Nodes -->
  <circle cx="110" cy="140" r="4" fill="#38bdf8" filter="url(#intenseGlow)"/>
  <circle cx="390" cy="130" r="4" fill="#38bdf8" filter="url(#intenseGlow)"/>
  <circle cx="90" cy="290" r="3.5" fill="#67e8f9"/>
  <circle cx="410" cy="280" r="3.5" fill="#67e8f9"/>
  <line x1="110" y1="140" x2="250" y2="220" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="390" y1="130" x2="250" y2="220" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Outer Metallic Shield Ring -->
  <circle cx="250" cy="220" r="105" fill="#030c1d" stroke="url(#silverTrim)" stroke-width="5" stroke-opacity="0.8" filter="url(#laserGlow)"/>
  <circle cx="250" cy="220" r="100" fill="none" stroke="#0284c7" stroke-width="3" stroke-opacity="0.9"/>

  <!-- Inner Orbital Swirling Ring -->
  <ellipse cx="250" cy="220" rx="130" ry="38" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#intenseGlow)" transform="rotate(-28 250 220)"/>
  <ellipse cx="250" cy="220" rx="130" ry="38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" transform="rotate(-28 250 220)"/>

  <!-- Central Cybernetic "A" Emblem (Exact Replica of TerraSynx Crest) -->
  <g filter="url(#intenseGlow)">
    <!-- Apex Back Glow -->
    <circle cx="250" cy="150" r="12" fill="#38bdf8" opacity="0.6" filter="url(#laserGlow)"/>
    <polygon points="250,135 240,150 250,165 260,150" fill="#ffffff"/>

    <!-- Left Leg of A -->
    <path d="M 250 145 L 185 285 L 212 285 L 250 200 Z" fill="url(#neonCyan)"/>
    <!-- Right Leg of A -->
    <path d="M 250 145 L 315 285 L 288 285 L 250 200 Z" fill="url(#neonBlue)"/>
    <!-- Central Crossbeam Core -->
    <polygon points="215,255 285,255 280,270 220,270" fill="url(#silverTrim)"/>
    <!-- Bright Center Prism Core -->
    <polygon points="250,175 230,240 270,240" fill="#04122c" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="250,185 240,230 260,230" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- TERRASYNX Typography -->
  <text x="250" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="8" fill="#ffffff" filter="url(#intenseGlow)">TERRASYNX</text>
  
  <text x="250" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="6" fill="#38bdf8" opacity="0.9">GLOBAL INTELLIGENCE SYSTEM</text>

  <!-- Bottom Cyber Accent Line -->
  <line x1="120" y1="465" x2="380" y2="465" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="250" cy="465" r="3" fill="#ffffff" filter="url(#intenseGlow)"/>
</svg>
