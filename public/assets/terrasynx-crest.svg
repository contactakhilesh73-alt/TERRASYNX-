<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <radialGradient id="crestBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#082252"/>
      <stop offset="60%" stop-color="#040e24"/>
      <stop offset="100%" stop-color="#01040a"/>
    </radialGradient>
    <linearGradient id="crestChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="crestLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="crestRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <filter id="crestGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="400" height="400" rx="80" fill="url(#crestBg)"/>

  <!-- Radar Grid Target Rings -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Orbital Ring (Rear pass) -->
  <path d="M 40 230 Q 100 130 350 160" fill="none" stroke="#0284c7" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Main Metallic Circular Bezel -->
  <circle cx="200" cy="200" r="110" fill="#020817" stroke="url(#crestChrome)" stroke-width="7" filter="url(#crestGlow)"/>
  <circle cx="200" cy="200" r="102" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-opacity="0.9"/>
  <circle cx="200" cy="200" r="95" fill="#051535"/>

  <!-- Inner Reticle -->
  <circle cx="200" cy="200" r="82" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="5 5"/>

  <!-- Central "A" Monogram -->
  <g filter="url(#crestGlow)">
    <path d="M 200 130 L 140 250 L 168 250 L 200 188 Z" fill="url(#crestLeft)"/>
    <path d="M 200 130 L 260 250 L 232 250 L 200 188 Z" fill="url(#crestRight)"/>
    <polygon points="166,220 234,220 228,236 172,236" fill="#e0f2fe"/>
    <polygon points="200,158 178,212 222,212" fill="#04122c" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="200,168 188,206 212,206" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Orbital Ring (Front pass wrapping around) -->
  <ellipse cx="200" cy="200" rx="145" ry="44" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" filter="url(#crestGlow)" transform="rotate(-28 200 200)"/>
  <ellipse cx="200" cy="200" rx="145" ry="44" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" transform="rotate(-28 200 200)"/>

  <!-- Apex Starburst Lens Flare -->
  <g transform="translate(200, 90)" filter="url(#crestGlow)">
    <polygon points="0,-18 4,0 0,18 -4,0" fill="#ffffff"/>
    <polygon points="-18,0 0,4 18,0 0,-4" fill="#ffffff"/>
    <circle cx="0" cy="0" r="6" fill="#67e8f9"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
</svg>
